<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="vojta.jpg" type="image/x-icon">
    <title>Chyť Vojtu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        button {
            width: 100px;
            padding: 10px;
        }

        #catchPic {
            position: absolute;
            top: 100px;
            left: 0;

            width: 300px;
            height: 300px;

            padding: 0;
            border: none;
            background: transparent;

            cursor: pointer;
            z-index: 10;
        }

        #catchPic img {
            width: 100%;
            height: 100%;

            display: block;
            object-fit: cover;

            pointer-events: none;
        }

        #show {
            border: solid greenyellow;
            color: white;
            background: red;
        }

        #show:hover {
            animation: rotate360 0.1s linear infinite;
        }

        #hide {
            border: solid blue;
            color: white;
            background: green;
        }

        #hide:hover {
            animation: rotate-360 0.1s linear infinite;
        }

        #score {
            color: white;
        }

        @keyframes rotate360 {
            from {
                rotate: 0deg;
            }

            to {
                rotate: 360deg;
            }
        }

        @keyframes rotate-360 {
            from {
                rotate: 0deg;
            }

            to {
                rotate: -360deg;
            }
        }
    </style>
</head>

<body>

    <button id="show">Klikni pro zobrazení obrázku</button>
    <button id="hide">Klikni pro skrytí obrázku</button>

    <p id="score">Skore: 0/20</p>

    <p id="text"></p>

    <script src="main.js"></script>

</body>

</html>
